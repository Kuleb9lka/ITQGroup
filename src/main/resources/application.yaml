server:
  port: 8088

spring:
  application:
    name: ITQGroup
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/itqgroupdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
worker:
  submission:
    batch-size: ${SUBMIT_WORKER_BATCH_SIZE:5}
    enabled: true
    cron-expression: ${SUBMISSION_WORKER_CRON_EXPRESSION:*/30 * * * * *}
  approval:
    batch-size: ${APPROVE_WORKER_BATCH_SIZE:5}
    enabled: true
    cron-expression: ${APPROVAL_WORKER_CRON_EXPRESSION:*/30 * * * * *}
